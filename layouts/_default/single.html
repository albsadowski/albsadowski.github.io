{{ define "main" }}
<article>
    <header class="page-header">
        <a href="{{ .Site.Home.Permalink }}" class="back-link">{{ .Site.Title }}</a>
        <h1>{{ .Title }}</h1>
        {{- if not .Date.IsZero }}
        <p class="meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "January 2006" }}</time></p>
        {{- end }}
    </header>
    {{ .Content }}
</article>
{{ end }}
